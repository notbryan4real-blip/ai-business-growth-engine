services:
  - type: web
    name: ai-business-growth-engine-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: APP_API_TOKEN
        generateValue: true
      - key: AI_MODEL
        value: claude-haiku-4-5
      - key: CORS_ORIGINS
        value: https://notbryan4real-blip.github.io
      - key: GROWTH_ENGINE_DATA_PATH
        value: data/runtime_store.json

  - type: web
    name: crypto-nexus-research-api
    runtime: python
    rootDir: crypto-trading
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AI_MODEL
        value: claude-haiku-4-5
      - key: AI_API_KEY
        sync: false
