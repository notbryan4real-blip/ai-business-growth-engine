name: Test Growth Engine
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Crypto Nexus dependencies
        run: pip install -r crypto-trading/requirements.txt
      - name: Compile Crypto Nexus backend
        run: python -m py_compile crypto-trading/engine.py crypto-trading/api.py crypto-trading/ai_pipeline.py crypto-trading/backtest.py
      - name: Smoke-test Crypto Nexus API imports
        env:
          PYTHONPATH: crypto-trading
        run: python -c "import api; print(api.app.title)"
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Smoke-test API imports
        env:
          PYTHONPATH: .
        run: python -c "import app; print(app.app.title)"
      - name: Test JARVIS browser controls
        # Node's built-in runner needs no npm install or new application dependencies.
        run: node --test tests/jarvis-*.test.cjs
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          for name in ("index", "swarm"):
              html = Path(f"dashboard/{name}.html").read_text(encoding="utf-8")
              for index, (attrs, code) in enumerate(re.findall(r"<script([^>]*)>(.*?)</script>", html, re.S)):
                  if not code.strip() or "importmap" in attrs:
                      continue
                  path = Path(f"/tmp/{name}-{index}.mjs")
                  path.write_text(code, encoding="utf-8")
                  subprocess.run(["node", "--check", str(path)], check=True)
          for path in Path("dashboard").glob("*.js"):
              subprocess.run(["node", "--input-type=module", "--check"], input=path.read_text(), text=True, check=True)
          PY
