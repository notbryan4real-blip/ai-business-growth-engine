name: Test Growth Engine
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Crypto Nexus dependencies
        run: pip install -r crypto-trading/requirements.txt
      - name: Compile Crypto Nexus backend
        run: python -m py_compile crypto-trading/engine.py crypto-trading/api.py crypto-trading/ai_pipeline.py crypto-trading/backtest.py
      - name: Smoke-test Crypto Nexus API imports
        env:
          PYTHONPATH: crypto-trading
        run: python -c "import api; print(api.app.title)"
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Smoke-test API imports
        env:
          PYTHONPATH: .
        run: python -c "import app; print(app.app.title)"
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("dashboard/index.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/dashboard.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/dashboard.js
